name: Deploy

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # Re-runs the CI gates against the tagged commit; a tag can point anywhere.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CAPABILITY_ACTIVE_KEY_ID: ${{ vars.CAPABILITY_ACTIVE_KEY_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KRYPTEX_ORIGIN: ${{ vars.KRYPTEX_ORIGIN }}
      PERMIT_ISSUANCE_ACTIVE_KEY_ID: ${{ vars.PERMIT_ISSUANCE_ACTIVE_KEY_ID }}
      TURNSTILE_EXPECTED_ACTION: create_permit
      TURNSTILE_EXPECTED_HOSTNAME: ${{ vars.TURNSTILE_EXPECTED_HOSTNAME }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production configuration
        env:
          CAPABILITY_HMAC_KEYRING: ${{ secrets.CAPABILITY_HMAC_KEYRING }}
          PERMIT_ISSUANCE_KEYRING: ${{ secrets.PERMIT_ISSUANCE_KEYRING }}
          RATE_LIMIT_KEY: ${{ secrets.RATE_LIMIT_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: bun run deploy:validate

      - name: Build production artifacts
        run: bun run build

      - name: Reconcile private R2 storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run infra:r2:reconcile

      - name: Verify private R2 storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run infra:predeploy:verify

      - name: Deploy Worker
        env:
          CAPABILITY_HMAC_KEYRING: ${{ secrets.CAPABILITY_HMAC_KEYRING }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PERMIT_ISSUANCE_KEYRING: ${{ secrets.PERMIT_ISSUANCE_KEYRING }}
          RATE_LIMIT_KEY: ${{ secrets.RATE_LIMIT_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/kryptex-secrets.json"
          trap 'rm -f -- "${secrets_file}"' EXIT
          umask 077
          jq -n '{
              CAPABILITY_HMAC_KEYRING: env.CAPABILITY_HMAC_KEYRING,
              PERMIT_ISSUANCE_KEYRING: env.PERMIT_ISSUANCE_KEYRING,
              RATE_LIMIT_KEY: env.RATE_LIMIT_KEY,
              TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY
            }' > "${secrets_file}"
          bunx wrangler deploy \
            --config packages/worker/wrangler.jsonc \
            --strict \
            --secrets-file "${secrets_file}" \
            --var "CAPABILITY_ACTIVE_KEY_ID:${CAPABILITY_ACTIVE_KEY_ID}" \
            --var "EXPECTED_ORIGIN:${KRYPTEX_ORIGIN}" \
            --var "PERMIT_ISSUANCE_ACTIVE_KEY_ID:${PERMIT_ISSUANCE_ACTIVE_KEY_ID}" \
            --var "TURNSTILE_EXPECTED_ACTION:${TURNSTILE_EXPECTED_ACTION}" \
            --var "TURNSTILE_EXPECTED_HOSTNAME:${TURNSTILE_EXPECTED_HOSTNAME}" \
            --tag "${GITHUB_SHA}" \
            --message "GitHub Actions run ${GITHUB_RUN_ID}"

      - name: Run non-consuming smoke checks
        run: bun run deploy:smoke
